global:
  scrape_interval: 15s

otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
