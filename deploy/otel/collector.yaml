receivers:
  otlp/platform:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resource/platform:
    attributes:
      - key: deployment.environment.name
        value: local
        action: upsert
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/platform:
      receivers: [otlp/platform]
      processors: [memory_limiter, resource/platform, attributes/redact, batch]
      exporters: [otlp/tempo]
    metrics/platform:
      receivers: [otlp/platform]
      processors: [memory_limiter, resource/platform, batch]
      exporters: [otlphttp/prometheus]
    logs/platform:
      receivers: [otlp/platform]
      processors: [memory_limiter, resource/platform, attributes/redact, batch]
      exporters: [otlphttp/loki]
    # Phase 2 reserves receivers otlp/environments and pipelines traces|metrics|logs/environments
    # with a separate memory_limiter and rate limits (PITFALLS 9). Do not share platform pipelines.
